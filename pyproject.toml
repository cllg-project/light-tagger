[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cllg-light-tagging"
version = "0.1.0"
description = "Light CRF tagger for notes, bibliographic citations and references in Greek/Latin text"
requires-python = ">=3.10,<3.13"
dependencies = ["python-crfsuite>=0.9.9"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
